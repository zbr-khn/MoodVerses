<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion-Based Quran Verses</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/manifest.json">


</head>
<body>
    <header>
        <nav class="navbar">
            <!-- <div class="logo-container">
                <img src="/icons/navbar_logo.png" alt="Logo" class="logo">
            </div> -->
            <div class="settings-container">
                <button id="settings-icon" class="settings-icon">⚙️</button>
                <div id="settings-menu" class="settings-menu">
                    <button id="reload-page">Reload</button>
                    <button id="send-feedback">Suggestions</button>
                </div>
            </div>
        </nav>
    </header>
    <div class="container">
        <h1 id="greeting">Assalamualaikum! <br>How Are You Feeling Today?</h1>
        <div class="button-container">
            <button id="happyBtn" class="emotion-btn happy">Happy</button>
            <button id="sadBtn" class="emotion-btn sad">Sad</button>
            <button id="lonelyBtn" class="emotion-btn lonely">Lonely</button>
            <button id="thankfulBtn" class="emotion-btn thankful">Thankful</button>
            <button id="angryBtn" class="emotion-btn angry">Angry</button>
            <button id="anxiousBtn" class="emotion-btn anxious">Anxious</button>
        </div>
        <div id="verseBox" class="verse-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
